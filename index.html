        {

        {

        {
            q: "A nurse technician is assigned to a patient experiencing a grand mal seizure. Which action should the technician perform?",

        {

        {

        {

        {

        {

        {

        {
            q: "When answering a question about priority, the technician should remember that physiological needs come first. Which of these is the highest priority?",
            options: ["Helping a patient find their lost eyeglasses.", "Ensuring a patient with difficulty swallowing is sitting upright during a meal.", "Emptying a full urinary drainage bag.", "Changing a soiled bedsheet for a patient who is sleeping."],
            correct: 1,
            rationale: "Ensuring an open airway and preventing aspiration is a life-saving physiological intervention."
        },
        {
            q: "A technician is asked to collect a mid-stream (clean-catch) urine specimen. What is the most important instruction to give the patient?",
            options: ["'Collect the very first drop of urine into the cup.'", "'Fill the cup to the very top so the lab has enough.'", "'Start urinating into the toilet, then place the cup into the stream.'", "'It does not matter if the inside of the cup is touched.'"],

            rationale: "Mid-stream collections wash away residual flora from the urethral meatus, yielding a clean sample."
        },
        {
            q: "In a 'test-trap' question, you might see the word 'Always' or 'Never.' Why are these often incorrect in clinical scenarios?",
            options: ["Because they represent absolute statements that rarely account for individual patient needs.", "Because they are too short to be the right answer.", "Because they are only used for emergency procedures.", "Because the test-maker wants to make the question easier."],

            rationale: "Medical procedures depend on the patient's condition, so absolute rules are rarely accurate."
        },
        {
            q: "A nurse technician is about to help a patient out of bed. The technician notices the patient’s identification (ID) band is missing. What is the most appropriate action?",

            correct: 2,
            rationale: "You must always verify the patient's identity using two forms of identification before performing a procedure."
        },
        {
            q: "Which of the following is a 'test-trap' distractor when asked about patient safety during a fall?",

            rationale: "Trying to catch a falling patient can injure both the patient and the healthcare worker."
        },
        {
            q: "When a question asks for the first action in a clinical scenario, the technician should prioritize:",
            options: ["Documenting the event in the chart.", "Assessing the patient for immediate danger or distress.", "Calling the doctor to report the situation.", "Cleaning the room to prepare for a procedure."],
            correct: 1,
            rationale: "Assessment is always the first step in the clinical problem-solving process."
        },
        {
            q: "A nurse technician is assisting a patient with a weak right side to walk. Where should the technician stand?",
            options: ["On the patient's left (strong) side.", "On the patient's right (weak) side.", "Directly in front of the patient, walking backward.", "Behind the patient, holding onto their waist."],
            correct: 1,
            rationale: "Standing on the weak side allows the technician to provide stability and support if the patient's leg gives way."
        },
        {
            q: "A technician is asked to perform a Point-of-Care (POC) Blood Glucose test. The technician has performed this many times but realizes the control solution for the machine has expired. The technician should:",

            rationale: "Using expired solutions compromises the accuracy and validity of the equipment."
        },
        {
            q: "After removing personal protective equipment (PPE) after caring for an isolated patient, which action should the nurse technician perform last?",

            rationale: "Hand hygiene removes any transient microorganisms acquired during the PPE removal sequence."
        },
        {
            q: "Post-mortem care has been completed by the nurse technician. What is the main goal when preparing the patient's body and room?",
            options: ["To prepare the body for immediate autopsy.", "To make the body look peaceful and dignified for the family.", "To hide the patient's condition from other visitors.", "To leave all of the medical equipment attached."],
            correct: 1,
            rationale: "Post-mortem care focuses on dignity and respect to help the family's grieving process."
        },
        {
            q: "When monitoring the oxygen saturation of a patient using a pulse oximeter, what should the nurse technician check before applying the sensor?",
            options: ["Whether the patient is right-handed or left-handed.", "If the patient is wearing dark or waterproof nail polish.", "If the patient's blood pressure is high.", "Whether the patient is breathing through the nose or mouth."],
            correct: 1,
            rationale: "Dark or waterproof nail polish interferes with the sensor's light absorption."
        },
        {
            q: "A nurse technician in a psychiatric unit observes a patient trying to swallow a large plastic utensil during a meal. What is the priority action?",
            options: ["Write an incident report for the supervisor.", "Approach the patient, ensure a clear airway, and notify the clinical team.", "Tell the other patients not to look.", "Wait until the patient finishes their meal."],
            correct: 1,
            rationale: "Ensuring an open airway and patient safety is the immediate priority during a self-harm emergency."
        },
        {
            q: "What is the best approach when you are running out of time during an exam and have several unanswered questions?",
            options: ["Change all of your previous answers just to be safe.", "Do not leave any question blank; ensure every item is filled.", "Skip the rest of the questions and submit the exam early.", "Guess 'A' for all remaining questions without reading them."],

            rationale: "Unanswered questions are scored as incorrect on standard credentialing exams."
        },
        {
            q: "Which of the following is considered a subjective finding that needs to be reported by a nurse technician?",

            correct: 1,
            rationale: "Subjective data are symptoms described by the patient that cannot be measured directly by healthcare staff."
        },
        {
            q: "When transferring a patient from a wheelchair to the bed, the nurse technician should position the wheelchair at what angle to the bed?",

            rationale: "A 45-degree angle ensures maximum stability during the pivot maneuver."

        {
            q: "A nurse technician needs to provide a bed bath for an unconscious patient. What is the most important infection control measure?",

            correct: 1,

        },
        {
            q: "A patient's family member insists on knowing the patient's diagnosis. The patient is awake and oriented. What should the nurse technician do?",

        {
            q: "The nurse technician accidentally spills a chemical solution on the floor. Where should the technician look for information regarding cleanup and hazards?",
            options: ["The patient's chart.", "The Safety Data Sheet (SDS) binder.", "The employee breakroom bulletin board.", "The nurse's personal phone."],
            correct: 1,
            rationale: "The SDS binder contains specific instructions on hazard management and emergency cleanup procedures."

    let currentQuestionIndex = 0;
    let score = 0;
    let participantName = "";
    let timeLeft = 1500; // 25 minutes in seconds
    let timerInterval;

    function startExam() {
        const nameInput = document.getElementById('user-name').value.trim();
        if (!nameInput) {
            alert("Please enter your name to start the exam.");
            return;
        }
        
        participantName = nameInput;
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('progress-container').style.display = 'block';
        
        initQuiz();
        document.querySelectorAll('.question-card')[0].classList.add('active');
        startTimer();
    }

    function startTimer() {
        const timerDisplay = document.getElementById('timer-display');
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Time is up!");
                showResults();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('timer-display').innerText = `Time Left: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = `question-card`;
            card.id = `q-card-${index}`;
            card.innerHTML = `
                <h3>Question ${index + 1} of ${questions.length}</h3>
                <p>${q.q}</p>
                ${q.options.map((opt, i) => `<div class="option" onclick="selectOption(${index}, ${i}, this)">${opt}</div>`).join('')}
                <div class="rationale" id="rationale-${index}"><strong>Rationale:</strong> ${q.rationale}</div>
                <button class="btn-nav" id="next-btn-${index}" onclick="nextQuestion()" style="display:none">Next Question</button>
            `;
            container.appendChild(card);
        });
    }

    function selectOption(qIndex, oIndex, element) {
        const card = document.getElementById(`q-card-${qIndex}`);
        const options = card.querySelectorAll('.option');
        
        if (card.querySelector('.selected')) return;

        element.classList.add('selected');
        const rationale = card.querySelector(`#rationale-${qIndex}`);
        
        if (oIndex === questions[qIndex].correct) {
            score++;
            element.style.backgroundColor = "#27ae60";
            element.style.color = "white";
        } else {
            element.style.backgroundColor = "#e74c3c";
            element.style.color = "white";
            options[questions[qIndex].correct].style.backgroundColor = "#27ae60";
            options[questions[qIndex].correct].style.color = "white";
        }

        rationale.style.display = 'block';
        document.getElementById(`next-btn-${qIndex}`).style.display = 'inline-block';
    }

    function nextQuestion() {
        const cards = document.querySelectorAll('.question-card');
        cards[currentQuestionIndex].classList.remove('active');
        currentQuestionIndex++;

        updateProgress();

        if (currentQuestionIndex < questions.length) {
            cards[currentQuestionIndex].classList.add('active');
        } else {
            showResults();
        }
    }

    function Progress() {
        const percent = (currentQuestionIndex / questions.length) * 100;
        document.getElementById('progress-bar').style.width = percent + '%';
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('progress-container').style.display = 'none';
        document.getElementById('timer-display').style.display = 'none';
        
        // Hide all cards if any were active
        const cards = document.querySelectorAll('.question-card');
        cards.forEach(card => card.classList.remove('active'));

        const results = document.getElementById('results-screen');
        results.style.display = 'block';
        
        document.getElementById('candidate-name').innerHTML = `Candidate: <strong>${participantName}</strong>`;
        document.getElementById('score-text').innerText = `You scored ${score} out of ${questions.length}`;
    }
</script>
